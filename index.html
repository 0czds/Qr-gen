<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --bg:#f2f4f5; --surface:#fff; --line:#dde2e5; --ink:#26303a; --muted:#6b7782; --accent:#4f7a78; --accent-hover:#436866; --on-accent:#fff; --err:#b4534a; }
  .dark { --bg:#13171a; --surface:#1b2024; --line:#2a3138; --ink:#e4e8eb; --muted:#8c97a1; --accent:#7fa9a6; --accent-hover:#93b9b6; --on-accent:#0f1416; }
  *, *::before, *::after { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--ink); transition:background-color .3s,color .3s; }
  button, textarea, a { font:inherit; }
  button { cursor:pointer; background:none; border:0; color:inherit; }
  main { max-width:32rem; margin:0 auto; padding:2.5rem 1.25rem; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; }
  h1 { margin:0; font-size:1.5rem; font-weight:600; }
  .surface { background:var(--surface); border:1px solid var(--line); border-radius:1.25rem; padding:1.25rem; }
  .muted { color:var(--muted); }
  .btn, .btn-line, .btn-quiet { display:block; border-radius:.875rem; padding:.85rem 1rem; text-align:center; text-decoration:none; }
  .btn { background:var(--accent); color:var(--on-accent); font-weight:600; transition:background-color .2s; }
  .btn:hover:not(:disabled) { background:var(--accent-hover); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn-line { border:1px solid var(--line); color:var(--ink); transition:border-color .2s,color .2s; }
  .btn-line:hover { border-color:var(--accent); color:var(--accent); }
  .btn-quiet { color:var(--muted); font-size:.875rem; padding:.5rem .75rem; transition:color .2s; }
  .btn-quiet:hover { color:var(--ink); }
  .tabs { display:flex; gap:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--line); }
  .tab { padding:.6rem 0; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .2s,border-color .2s; }
  .tab[aria-selected="true"] { color:var(--ink); border-color:var(--accent); }
  label { display:block; font-size:.875rem; color:var(--muted); margin-bottom:.5rem; }
  textarea { display:block; width:100%; resize:none; padding:1rem; font-size:1rem; background:var(--bg); border:1px solid var(--line); border-radius:.875rem; color:var(--ink); }
  textarea::placeholder { color:var(--muted); opacity:.7; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .row { display:flex; gap:.5rem; }
  .row > * { flex:1; }
  .mt { margin-top:1rem; } .mt-s { margin-top:.5rem; }
  .msg { text-align:center; font-size:.875rem; margin:.75rem 0 0; min-height:1.25rem; }
  .err { color:var(--err); }
  .center { text-align:center; }
  .qr-frame { background:#fff; border-radius:1rem; padding:.75rem; display:inline-block; border:1px solid var(--line); line-height:0; }
  #qrCanvas { width:15rem; height:15rem; max-width:100%; image-rendering:pixelated; }
  #readerWrap { position:relative; border-radius:1rem; overflow:hidden; background:#000; }
  #video { display:block; width:100%; max-height:22rem; object-fit:cover; }
  .frame { position:absolute; inset:15%; border:2px solid var(--accent); border-radius:1rem; pointer-events:none; }
  .result { background:var(--bg); border:1px solid var(--line); border-radius:.875rem; padding:1rem; overflow-wrap:anywhere; white-space:pre-wrap; unicode-bidi:plaintext; text-align:start; }
  [hidden] { display:none !important; }
  .site-credit { margin-top:2rem; padding:1rem 0; text-align:center; color:var(--muted); font-size:.7rem; border-top:1px solid var(--line); opacity:.75; }
  .site-credit span { color:var(--accent); font-weight:500; }
</style>
</head>
<body>
<main>
  <header>
    <h1>رمز QR</h1>
    <button id="themeBtn" class="btn-quiet"></button>
  </header>

  <div class="tabs" role="tablist">
    <button id="tabGen" class="tab" role="tab">صانع الـ QR</button>
    <button id="tabScan" class="tab" role="tab">قارئ الـ QR</button>
  </div>

  <section id="viewGen" class="surface">
    <label for="text">الرابط أو النص</label>
    <textarea id="text" rows="4" placeholder="https://example.com" dir="auto"></textarea>
    <button id="makeBtn" class="btn mt" style="width:100%">أنشئ الرمز</button>
    <p id="genMsg" class="msg err"></p>
    <div id="qrOut" class="center mt-s" hidden>
      <div class="qr-frame"><canvas id="qrCanvas"></canvas></div>
      <div class="row mt">
        <button id="dlBtn" class="btn">تحميل الصورة</button>
        <button id="copyImgBtn" class="btn-line">نسخ الصورة</button>
      </div>
      <p id="outMsg" class="msg muted"></p>
    </div>
  </section>

  <section id="viewScan" class="surface" hidden>
    <div class="row">
      <button id="camBtn" class="btn">تشغيل الكاميرا</button>
      <button id="fileBtn" class="btn-line">رفع صورة</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" hidden>
    <div id="readerWrap" class="mt" hidden>
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
    </div>
    <button id="stopBtn" class="btn-quiet mt-s" style="width:100%" hidden>إيقاف الكاميرا</button>
    <p id="scanMsg" class="msg err"></p>
    <div id="resultBox" hidden>
      <div class="muted" style="font-size:.875rem;margin-bottom:.5rem">النتيجة</div>
      <div id="resultText" class="result"></div>
      <div class="row mt">
        <button id="copyBtn" class="btn">نسخ النص</button>
        <a id="openLink" class="btn-line" target="_blank" rel="noopener noreferrer" hidden>فتح الرابط</a>
      </div>
      <p id="copyMsg" class="msg muted"></p>
    </div>
  </section>

  <footer class="site-credit">
    Made by <span>younes</span>
  </footer>
</main>

  $('copyMsg').textContent = '';
  let url = null;
  try { const u = new URL(text.trim()); if (u.protocol === 'http:' || u.protocol === 'https:') url = u.href; } catch {}
  $('openLink').hidden = !url;
  if (url) $('openLink').href = url;
  $('scanMsg').textContent = '';
}

/* Camera */
let stream = null, camTimer = null, camOn = false;
function stopCam() {
  camOn = false; clearTimeout(camTimer);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $('video'); v.pause(); v.srcObject = null;
  $('readerWrap').hidden = true; $('stopBtn').hidden = true; $('camBtn').disabled = false;
}
async function camLoop() {
  if (!camOn) return;
  const v = $('video');
  if (v.videoWidth) {
    const text = await decodeSource(v, v.videoWidth, v.videoHeight, 720);
    if (text) { stopCam(); showResult(text); return; }
  }
  camTimer = setTimeout(camLoop, 140);
}
$('camBtn').onclick = async () => {
  $('scanMsg').textContent = ''; $('resultBox').hidden = true;
  $('camBtn').disabled = true;
  if (!await canDecode()) { $('camBtn').disabled = false; $('scanMsg').textContent = NO_DECODER; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    const v = $('video'); v.srcObject = stream;
    $('readerWrap').hidden = false; $('stopBtn').hidden = false;
    await v.play();
    camOn = true; camLoop();
  } catch {
    stopCam();
    $('scanMsg').textContent = 'تعذّر تشغيل الكاميرا. اسمح للمتصفح بالوصول إليها وجرّب مرة أخرى.';
  }
};
$('stopBtn').onclick = stopCam;

/* Image upload */
$('fileBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  stopCam();
  $('scanMsg').textContent = ''; $('resultBox').hidden = true;
  if (!await canDecode()) { $('scanMsg').textContent = NO_DECODER; return; }
  try {
    const bmp = await createImageBitmap(f);
    let text = null;
    for (const w of [1600, 900, 500]) { text = await decodeSource(bmp, bmp.width, bmp.height, w); if (text) break; }
    if (bmp.close) bmp.close();
    if (text) showResult(text);
    else $('scanMsg').textContent = 'لم يتم العثور على رمز QR في هذه الصورة. جرّب صورة أوضح.';
  } catch { $('scanMsg').textContent = 'تعذّر فتح الصورة.'; }
};

$('copyBtn').onclick = async () => {
  const ok = await copyText($('resultText').textContent);
  flash($('copyMsg'), ok ? 'تم النسخ' : 'تعذّر النسخ');
};

setTab(store.get('tab', 'gen') === 'scan' ? 'scan' : 'gen');
</script>
</body>
</html>
